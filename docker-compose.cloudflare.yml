# docker-compose.cloudflare.yml
# Cloudflare Tunnel variant — replaces Tor with cloudflared
# Run via `lighthouse up --tunnel` (the CLI manages startup order)
networks:
  lighthouse:

services:
  backend:
    image: neozmmv/lighthouse-backend:latest
    container_name: lighthouse-backend
    ports:
      - "127.0.0.1:4406:8000" # localhost only — needed for file management page
    networks:
      - lighthouse
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_LOCAL_ENDPOINT: 127.0.0.1:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lighthouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lighthouse_secret}
      LIGHTHOUSE_KEYS_DIR: /lighthouse/keys
    volumes:
      - ${LIGHTHOUSE_DIR}/keys:/lighthouse/keys:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: neozmmv/lighthouse-frontend:latest
    container_name: lighthouse-frontend
    networks:
      - lighthouse
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    container_name: lighthouse-caddy
    networks:
      - lighthouse
    ports:
      - "${LIGHTHOUSE_PORT:-80}:80"
      - "127.0.0.1:4405:4405" # file management, localhost only
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lighthouse-cloudflared
    command: tunnel --url http://caddy:80
    networks:
      - lighthouse
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: lighthouse-minio
    command: server /data --console-address ":9001"
    networks:
      - lighthouse
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lighthouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lighthouse_secret}
      MINIO_API_REQUESTS_DEADLINE: "0"
    ports:
      - "127.0.0.1:9000:9000" # localhost only — presigned URLs from host
      - "127.0.0.1:9001:9001" # localhost only — minio console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: lighthouse-minio-init
    networks:
      - lighthouse
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lighthouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lighthouse_secret}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/lighthouse &&
        echo 'Bucket lighthouse created.'
      "
    restart: on-failure

volumes:
  caddy_data:
  caddy_config:
  minio_data:
