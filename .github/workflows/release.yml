name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - dev

jobs:
  build-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Linux amd64
        run: go build -ldflags "-X github.com/neozmmv/Lighthouse/cli/cmd.version=dev" -o lighthouse-linux-amd64
        working-directory: cli

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/neozmmv/Lighthouse/cli/cmd.version=dev" -o lighthouse-linux-arm64
        working-directory: cli

      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/neozmmv/Lighthouse/cli/cmd.version=dev" -o lighthouse-darwin-amd64
        working-directory: cli

      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/neozmmv/Lighthouse/cli/cmd.version=dev" -o lighthouse-darwin-arm64
        working-directory: cli

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: unix-binaries
          path: |
            cli/lighthouse-linux-amd64
            cli/lighthouse-linux-arm64
            cli/lighthouse-darwin-amd64
            cli/lighthouse-darwin-arm64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend

      - name: Copy frontend to CLI embed dir
        shell: pwsh
        run: Copy-Item -Recurse frontend/dist cli/cmd/frontend

      - name: Build backend
        run: go build -o ../cli/cmd/backend.exe .
        working-directory: backend-go

      - name: Build lighthouse.exe
        run: go build -ldflags "-X github.com/neozmmv/Lighthouse/cli/cmd.version=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}" -o lighthouse.exe .
        working-directory: cli

      - name: Download latest tray binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path tray\src-tauri\target\release | Out-Null

          $release = gh release list --repo neozmmv/Lighthouse --limit 100 --json tagName |
                     ConvertFrom-Json |
                     Where-Object { $_.tagName -like 'tray-v*' } |
                     Select-Object -First 1

          if (-not $release) {
            Write-Error "No tray-v* release found. Publish a tray release first."
            exit 1
          }

          gh release download $release.tagName `
            --repo neozmmv/Lighthouse `
            --pattern lighthouse-tray.exe `
            --dir tray\src-tauri\target\release

      - name: Update version in installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "dev" }
          (Get-Content installer.iss) -replace '#define AppVersion ".*"', "#define AppVersion `"$version`"" | Set-Content installer.iss

      - name: Build installer
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $inno installer.iss

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: windows-installer
          path: LighthouseSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: unix-binaries

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lighthouse ${{ github.ref_name }}"
          files: |
            lighthouse-linux-amd64
            lighthouse-linux-arm64
            lighthouse-darwin-amd64
            lighthouse-darwin-arm64
            LighthouseSetup.exe
            docker-compose.yml
            docker-compose.cloudflare.yml
            Caddyfile
            install.sh
            uninstall.sh
